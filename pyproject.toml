[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "messi-game"
version = "0.1.0"
description = "Juego interactivo con reconocimiento de manos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python==4.8.1.78",
    "mediapipe==0.10.8",
    "numpy==1.24.3",
    "screeninfo==0.8.1",
    "mss==9.0.1",
    "pygame==2.6.1",
]

[project.scripts]
messi-start = "src.ui.game_main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
